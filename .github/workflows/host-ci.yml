name: Host CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ADAPTIVE_PI_YOCTO_SDK_RELEASE: v0.2.0
  ADAPTIVE_PI_YOCTO_SDK_INSTALLER: poky-glibc-x86_64-adaptive-pi-image-cortexa57-qemuarm64-toolchain-5.0.20.sh

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Verify C++ formatting
        run: |
          find apps platform -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build gcovr llvm

      - name: Configure coverage-enabled unit tests
        run: |
          cmake --preset debug-unit-tests \
            -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build coverage-enabled unit tests
        run: cmake --build build/debug-unit-tests --parallel

      - name: Run unit tests with coverage data
        run: ctest --test-dir build/debug-unit-tests --output-on-failure

      - name: Generate HTML coverage report
        run: |
          mkdir -p coverage
          LLVM_COV_BIN="$(command -v llvm-cov || command -v llvm-cov-18 || command -v llvm-cov-17 || true)"
          if [ -z "$LLVM_COV_BIN" ]; then
            echo "llvm-cov not found" >&2
            exit 1
          fi
          gcovr -r . \
            --gcov-executable "${LLVM_COV_BIN} gcov" \
            --html-details \
            --output coverage/index.html \
            --print-summary

      - name: Upload coverage pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./coverage

  deploy-pages:
    name: Deploy coverage to GitHub Pages
    needs: coverage
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build

      - name: Configure Debug Application
        run: cmake --preset debug-app -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF

      - name: Build Debug Application
        run: cmake --build build/debug-app --parallel

      - name: Configure Debug Unit Tests
        run: cmake --preset debug-unit-tests -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF

      - name: Build and run unit tests
        run: cmake --build build/debug-unit-tests --parallel

  build-and-test-exceptions:
    name: Build and unit test (exceptions enabled)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build

      - name: Configure exception-enabled unit tests
        run: |
          cmake --preset debug-unit-tests \
            -B build/ci-unit-tests-exceptions \
            -DADAPTIVE_PI_ENABLE_EXCEPTIONS=ON

      # Build the full exception-enabled test tree so every discovered CTest
      # executable is present before execution.
      - name: Build exception-enabled unit tests
        run: cmake --build build/ci-unit-tests-exceptions --parallel

      - name: Run exception-enabled unit tests
        run: ctest --test-dir build/ci-unit-tests-exceptions --output-on-failure

  cross-build-qemu-target:
    name: Cross-build QEMU target
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the versioned Yocto SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk-download

          gh release download "${ADAPTIVE_PI_YOCTO_SDK_RELEASE}" \
            --repo "${{ github.repository }}" \
            --pattern "${ADAPTIVE_PI_YOCTO_SDK_INSTALLER}*" \
            --dir sdk-download

      - name: Verify SDK checksum
        run: |
          cd sdk-download

          sha256sum -c \
            "${ADAPTIVE_PI_YOCTO_SDK_INSTALLER}.sha256"

      - name: Install Yocto SDK
        run: |
          printf 'Y\n' | sh \
            sdk-download/${ADAPTIVE_PI_YOCTO_SDK_INSTALLER} \
            -d "${GITHUB_WORKSPACE}/yocto/sdk"

      - name: Configure AArch64 application build
        run: cmake --preset debug-qemu-app -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF

      - name: Build AArch64 applications
        run: cmake --build --preset debug-qemu-app

      - name: Verify target executable architectures
        run: |
          mapfile -d '' target_binaries < <(
            find build/debug-qemu-app/apps -type f -executable -print0
          )

          if [[ "${#target_binaries[@]}" -eq 0 ]]; then
            echo "No target application executables were built." >&2
            exit 1
          fi

          for target_binary in "${target_binaries[@]}"; do
            file "${target_binary}"
            readelf -h "${target_binary}" | grep -q "Machine:.*AArch64"
          done
