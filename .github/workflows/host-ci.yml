name: Host CI

on:
  push:
    branches:
      - "**"
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  ADAPTIVE_PI_YOCTO_SDK_RELEASE: v0.2.0
  ADAPTIVE_PI_YOCTO_SDK_INSTALLER: poky-glibc-x86_64-adaptive-pi-image-cortexa57-qemuarm64-toolchain-5.0.20.sh

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Verify C++ formatting
        run: |
          find apps platform -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

  build-and-test:
    if: github.event_name == 'pull_request'
    name: Build and unit test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build

      - name: Configure Debug Application
        run: cmake --preset debug-app -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF -DADAPTIVE_PI_ENABLE_ESBMC=OFF

      - name: Build Debug Application
        run: cmake --build build/debug-app --parallel

      - name: Configure Debug Unit Tests
        run: cmake --preset debug-unit-tests -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF -DADAPTIVE_PI_ENABLE_ESBMC=OFF

      - name: Build and run unit tests
        run: cmake --build build/debug-unit-tests --parallel

  build-and-test-exceptions:
    if: github.event_name == 'pull_request'
    name: Build and unit test (exceptions enabled)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build

      - name: Configure exception-enabled unit tests
        run: |
          cmake --preset debug-unit-tests \
            -B build/ci-unit-tests-exceptions \
            -DADAPTIVE_PI_ENABLE_EXCEPTIONS=ON \
            -DADAPTIVE_PI_ENABLE_ESBMC=OFF

      # Build the full exception-enabled test tree so every discovered CTest
      # executable is present before execution.
      - name: Build exception-enabled unit tests
        run: cmake --build build/ci-unit-tests-exceptions --parallel

      - name: Run exception-enabled unit tests
        run: ctest --test-dir build/ci-unit-tests-exceptions --output-on-failure

  esbmc-proofs:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: ESBMC proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build cmake curl unzip coreutils findutils util-linux python3

      - name: Install pinned ESBMC distribution
        run: scripts/install-esbmc.sh build/debug-esbmc-proofs/tools/esbmc

      - name: Restore gate integration test result
        id: gate-tests
        uses: actions/cache@v4
        with:
          path: build/esbmc-gate-tests
          key: esbmc-gate-tests-v1-ubuntu24-${{ runner.arch }}-${{ hashFiles('cmake/**', 'scripts/esbmc/**', 'scripts/install-esbmc.sh', '.github/workflows/host-ci.yml') }}

      - name: Verify gate failure handling
        if: steps.gate-tests.outputs.cache-hit != 'true'
        run: |
          python3 scripts/esbmc/test_gate.py \
            --esbmc "$PWD/build/debug-esbmc-proofs/tools/esbmc/bin/esbmc"
          mkdir -p build/esbmc-gate-tests
          echo passed > build/esbmc-gate-tests/result

      - name: Restore successful proof results
        uses: actions/cache@v4
        with:
          path: build/esbmc-result-cache
          key: esbmc-results-v1-ubuntu24-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            esbmc-results-v1-ubuntu24-${{ runner.arch }}-

      - name: Configure and verify affected ESBMC proofs with Z3
        run: |
          cmake --preset debug-esbmc-proofs \
            -DESBMC_EXECUTABLE="$PWD/build/debug-esbmc-proofs/tools/esbmc/bin/esbmc" \
            -DADAPTIVE_PI_ESBMC_CACHE_DIR="$PWD/build/esbmc-result-cache"

      - name: Verify exception-enabled proofs
        run: |
          cmake --preset debug-esbmc-proofs \
            -B build/ci-esbmc-proofs-exceptions \
            -DESBMC_EXECUTABLE="$PWD/build/debug-esbmc-proofs/tools/esbmc/bin/esbmc" \
            -DADAPTIVE_PI_ENABLE_EXCEPTIONS=ON \
            -DADAPTIVE_PI_ESBMC_CACHE_DIR="$PWD/build/esbmc-result-cache"

      - name: Publish proof summary
        if: always()
        run: |
          for mode in debug-esbmc-proofs ci-esbmc-proofs-exceptions; do
            echo "## Configuration: $mode" >> "$GITHUB_STEP_SUMMARY"
            summary="build/$mode/esbmc/logs/summary.md"
            if [[ -f "$summary" ]]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'No proof summary was produced for this configuration. Check preceding steps; this is not verification success.' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Retain proof commands and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esbmc-proof-results
          path: |
            build/debug-esbmc-proofs/esbmc/logs/
            build/debug-esbmc-proofs/esbmc/proofs.cmake
            build/ci-esbmc-proofs-exceptions/esbmc/logs/
            build/ci-esbmc-proofs-exceptions/esbmc/proofs.cmake
          if-no-files-found: warn
          retention-days: 14

  cross-build-qemu-target:
    name: Cross-build QEMU target
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the versioned Yocto SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk-download

          gh release download "${ADAPTIVE_PI_YOCTO_SDK_RELEASE}" \
            --repo "${{ github.repository }}" \
            --pattern "${ADAPTIVE_PI_YOCTO_SDK_INSTALLER}*" \
            --dir sdk-download

      - name: Verify SDK checksum
        run: |
          cd sdk-download

          sha256sum -c \
            "${ADAPTIVE_PI_YOCTO_SDK_INSTALLER}.sha256"

      - name: Install Yocto SDK
        run: |
          printf 'Y\n' | sh \
            sdk-download/${ADAPTIVE_PI_YOCTO_SDK_INSTALLER} \
            -d "${GITHUB_WORKSPACE}/yocto/sdk"

      - name: Configure AArch64 application build
        run: cmake --preset debug-qemu-app -DADAPTIVE_PI_ENABLE_EXCEPTIONS=OFF

      - name: Build AArch64 applications
        run: cmake --build --preset debug-qemu-app

      - name: Verify target executable architectures
        run: |
          mapfile -d '' target_binaries < <(
            find build/debug-qemu-app/apps -type f -executable -print0
          )

          if [[ "${#target_binaries[@]}" -eq 0 ]]; then
            echo "No target application executables were built." >&2
            exit 1
          fi

          for target_binary in "${target_binaries[@]}"; do
            file "${target_binary}"
            readelf -h "${target_binary}" | grep -q "Machine:.*AArch64"
          done
