name: Coverage Pages

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Generate coverage after merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://romanr92.github.io/adaptive-pi/coverage/

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check out the merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install build and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build gcovr llvm

      - name: Configure coverage-enabled unit tests
        run: |
          cmake --preset debug-unit-tests \
            -DADAPTIVE_PI_ENABLE_EXCEPTIONS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build coverage-enabled unit tests
        run: cmake --build build/debug-unit-tests --parallel

      - name: Run unit tests with coverage data
        run: ctest --test-dir build/debug-unit-tests --output-on-failure

      - name: Generate report at /coverage/
        run: |
          mkdir -p site/coverage
          LLVM_COV_BIN="$(command -v llvm-cov || command -v llvm-cov-18 || command -v llvm-cov-17 || true)"
          if [ -z "$LLVM_COV_BIN" ]; then
            echo "llvm-cov not found" >&2
            exit 1
          fi
          gcovr -r . \
            --gcov-executable "${LLVM_COV_BIN} gcov" \
            --filter '^(apps|platform)/.*\.(c|cpp|cxx|h|hpp|hxx)$' \
            --exclude '^(apps|platform)/(.*/)?tests?/' \
            --exclude '^(apps|platform)/(.*/)?(test_[^/]*|[^/]*_(test|tests|spec))\.(c|cpp|cxx|h|hpp|hxx)$' \
            --html-details site/coverage/index.html \
            --json-summary site/coverage/summary.json \
            --print-summary
          test -s site/coverage/index.html
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          summary = json.loads(Path("site/coverage/summary.json").read_text())
          files = summary.get("files", [])
          production = re.compile(r"^(apps|platform)/.*\.(c|cpp|cxx|h|hpp|hxx)$")
          reported = [entry for entry in files if production.fullmatch(entry.get("filename", ""))]
          lines = sum(entry.get("line_total", 0) for entry in reported)
          if len(reported) != len(files) or not reported or lines <= 0:
              print("Coverage report has no valid production source results", file=sys.stderr)
              sys.exit(1)
          print(f"Coverage report contains {len(reported)} production files and {lines} instrumented lines")
          PY
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>AdaptivePi coverage</title></head>
          <body><a href="coverage/">View unit-test coverage</a></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
