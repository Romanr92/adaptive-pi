name: Coverage Pages

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Generate coverage after merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://romanr92.github.io/adaptive-pi/coverage/

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check out the merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install build and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build gcovr llvm

      - name: Build, test, and generate coverage
        run: scripts/run-coverage.sh build/coverage-check ON

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/coverage-check/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
